{% extends "base.html" %}
{% block title %}Admin Login — PlayNest{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="glass auth-card" data-aos="zoom-in">
    <a href="{{ url_for('main.landing') }}" class="text-gray text-decoration-none small d-inline-flex align-items-center gap-2 mb-4 hover-emerald" style="transition: color 0.2s;">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
    <div class="text-center mb-4">
      <i class="fa-solid fa-shield-halved text-emerald" style="font-size:2rem;"></i>
      <h3 class="mt-3 mb-1">Admin Control Room</h3>
      <p class="text-gray small mb-0">Restricted access.</p>
    </div>
    <form method="POST">
      <label class="pn-label">Passcode</label>
      <input type="password" name="passcode" class="pn-input mb-4" placeholder="Enter admin passcode" autofocus>
      <button type="submit" class="btn btn-pn-primary btn-block">Enter <i class="fa-solid fa-arrow-right"></i></button>
    </form>
  </div>
</section>
{% endblock %}

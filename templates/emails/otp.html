<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#0B0F0E;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0B0F0E;padding:40px 0;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#101B2D;border-radius:20px;overflow:hidden;">
        <tr><td style="background:linear-gradient(135deg,#10B981,#39FF88);padding:28px;text-align:center;">
          <span style="font-size:22px;font-weight:bold;color:#0B0F0E;">PLAYNEST</span>
        </td></tr>
        <tr><td style="padding:36px 40px;color:#FFFFFF;">
          <h2 style="margin:0 0 12px;">Hi {{ name }},</h2>
          <p style="color:#A3AAB8;font-size:15px;">Use the code below to verify your email and continue booking on PlayNest. This code expires in {{ valid_minutes }} minutes.</p>
          <div style="text-align:center;margin:32px 0;">
            <span style="display:inline-block;background:rgba(16,185,129,0.12);border:1px solid #10B981;color:#39FF88;font-size:32px;letter-spacing:10px;font-weight:bold;padding:16px 28px;border-radius:14px;">{{ otp_code }}</span>
          </div>
          <p style="color:#6B7484;font-size:13px;">Didn't request this? You can safely ignore this email.</p>
        </td></tr>
        <tr><td style="padding:20px 40px;border-top:1px solid rgba(255,255,255,0.08);color:#6B7484;font-size:12px;">
          PlayNest · support@playnest.app
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
